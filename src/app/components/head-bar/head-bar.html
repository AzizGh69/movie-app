<header class="head-bar">
  <h1><a routerLink="/">Movie List</a></h1>
  <button type="button" class="wishlist-button" routerLink="/wishlist">
    <fa-icon [icon]="faHeart" class="heart" />
    Wish list
    @if (wishlistCount() > 0) {
      <span class="badge">{{ wishlistCount() }}</span>
    }
  </button>
</header>
